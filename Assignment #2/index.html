<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microsoft Menu</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
            background: linear-gradient(135deg, #1b3d39 0%, #0d2321 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #ffffff;
            margin: 0;
        }

        .menu-container {
            width: 625px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 2rem;
            margin: 0;
            font-weight: normal;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 100px);
            grid-auto-rows: 100px;
            gap: 5px;
        }

        .tile {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease, outline 0.2s ease;
        }

        .tile:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
            outline: 2px solid rgba(255, 255, 255, 0.85);
            z-index: 10;
        }

        .span-2x2 {
            grid-column: span 2;
            grid-row: span 2;
        }

        .taskbar {
            margin-top: 15px;
            width: 100%;
        }

        .taskbar img {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="header">
            <h1>Start</h1>
            <div class="header-actions">
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">
                    <img src="Power Button.png" alt="Power Button" width="30">
                </a>
                <a href="https://www.instagram.com/jeymieow/" target="_blank">
                    <img src="https://i.pinimg.com/736x/1b/84/0d/1b840d37ef4a636d87e163895a7c272f.jpg" alt="Profile" width="25" style="border-radius: 50%;">
                </a>
            </div>
        </div>

        <div class="grid">
            <!-- Grindr (2x2) -->
            <a href="https://www.grindr.com/" target="_blank" class="span-2x2">
                <img src="https://play-lh.googleusercontent.com/YVkgJlX5rQcEY3umoiPIPKrBhDF_DxjhtirMk4-sBzGDUTVxg3qXlADIU_C8JcUtMXx1Jrg0hcwMj6IAEdmK" class="tile" alt="App">
            </a>

            <!-- Row 1 singles -->
            <a href="https://open.spotify.com/" target="_blank">
                <img src="https://i.pinimg.com/736x/9b/18/57/9b1857defd4e25ce19cfb390b9c9fdba.jpg" class="tile" alt="Spotify">
            </a>
            <a href="http://pinterest.com/" target="_blank">
                <img src="https://i.pinimg.com/1200x/5c/af/0e/5caf0e96302ba07a3fcb86fcdf0f5129.jpg" class="tile" alt="Pinterest">
            </a>
            <a href="https://www.instagram.com/" target="_blank">
                <img src="https://i.pinimg.com/1200x/7e/76/7f/7e767fe360fe2a528c8feb3cd6a7ed19.jpg" class="tile" alt="Instagram">
            </a>
            <a href="https://www.netflix.com/" target="_blank">
                <img src="https://i.pinimg.com/1200x/72/a0/50/72a0500ff35991d147a6b48e4bffc721.jpg" class="tile" alt="Netflix">
            </a>

            <!-- Row 2 singles -->
            <a href="https://www.canva.com/" target="_blank">
                <img src="https://i.pinimg.com/1200x/b2/24/bc/b224bcfb58a1861dee8afc847a5d657d.jpg" class="tile" alt="Canva">
            </a>
            <a href="https://www.reddit.com/" target="_blank">
                <img src="https://i.pinimg.com/736x/e8/16/fd/e816fd46732d510267ebae5aaf16413c.jpg" class="tile" alt="Reddit">
            </a>
            <a href="https://www.leagueoflegends.com/en-ph/" target="_blank" class="span-2x2">
                <img src="https://i.pinimg.com/1200x/d1/b1/1d/d1b11d5e4dbae547ac0d651476cec488.jpg" class="tile" alt="League of Legends">
            </a>

            <!-- Row 3 singles -->
            <a href="https://www.linkedin.com/" target="_blank">
                <img src="https://i.pinimg.com/736x/37/cb/45/37cb45471e72f36d99a84a2a2a8b1656.jpg" class="tile" alt="LinkedIn">
            </a>
            <a href="https://www.twitch.tv" target="_blank">
                <img src="https://i.pinimg.com/736x/9e/f6/8f/9ef68fc0ec30d7c8d2084d33ac37ac53.jpg" class="tile" alt="Twitch">
            </a>
            <a href="https://www.tiktok.com/" target="_blank">
                <img src="https://i.pinimg.com/736x/5d/63/c8/5d63c857404bab94c94a3f5b719628f2.jpg" class="tile" alt="TikTok">
            </a>
            <a href="https://twitter.com" target="_blank">
                <img src="https://i.pinimg.com/736x/c1/d9/6c/c1d96c1f7a256e1a4dc31da44d715178.jpg" class="tile" alt="Twitter">
            </a>
        </div>

        <div class="taskbar">
            <img src="taskbar.png" alt="TaskBar">
        </div>
    </div>

</body>
</html>
